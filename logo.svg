<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient for Figure Swoop & Head -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="50%" stop-color="#2171CD"/>
      <stop offset="100%" stop-color="#144E96"/>
    </linearGradient>

    <!-- Radial Gradient for Head Sphere -->
    <radialGradient id="headGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#6EA8F7"/>
      <stop offset="45%" stop-color="#2B74CE"/>
      <stop offset="100%" stop-color="#134785"/>
    </radialGradient>

    <!-- Red Gradient for Torso -->
    <linearGradient id="redGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F0332D"/>
      <stop offset="45%" stop-color="#D31D18"/>
      <stop offset="100%" stop-color="#9B0E0A"/>
    </linearGradient>

    <!-- Gold Gradient for Stars -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE43"/>
      <stop offset="60%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D49300"/>
    </linearGradient>

    <!-- Text 3D Red Gradient -->
    <linearGradient id="textRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8302A"/>
      <stop offset="100%" stop-color="#A51410"/>
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#191715" flood-opacity="0.18"/>
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#D49300" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 3 Golden Stars -->
    <!-- Star 1: Top Main Star -->
    <polygon points="305,42 312,61 332,61 316,73 322,92 305,80 288,92 294,73 278,61 298,61" 
             fill="url(#goldGrad)" filter="url(#starGlow)" />
    
    <!-- Star 2: Mid-Right Star -->
    <polygon points="350,56 355,70 370,70 358,79 362,93 350,84 338,93 342,79 330,70 345,70" 
             fill="url(#goldGrad)" filter="url(#starGlow)" />

    <!-- Star 3: Lower-Right Small Star -->
    <polygon points="366,110 370,121 382,121 372,128 375,139 366,132 357,139 360,128 350,121 362,121" 
             fill="url(#goldGrad)" filter="url(#starGlow)" />

    <!-- Blue Ascending Crescent Swoop -->
    <path d="M 314,84 
             C 270,140 220,230 190,320 
             C 170,380 178,440 220,500 
             C 255,548 295,570 316,576
             C 278,570 236,540 200,486
             C 168,438 165,372 188,300
             C 216,214 266,136 314,84 Z" 
          fill="url(#blueGrad)" />

    <!-- Main Red Torso Swoop -->
    <path d="M 270,165 
             C 245,245 235,320 240,400 
             C 246,470 280,535 344,562 
             C 328,520 316,460 335,400 
             C 346,365 372,342 390,380
             C 378,310 330,225 270,165 Z" 
          fill="url(#redGrad)" />

    <!-- Blue Head Sphere -->
    <circle cx="308" cy="226" r="34" fill="url(#headGrad)" />

    <!-- Inner 'SC' Emblem Badge in the lower right loop -->
    <g transform="translate(340, 410)">
      <!-- Outer circular 'C' swoop -->
      <path d="M 28,6 A 26,26 0 1,0 28,46 L 24,38 A 18,18 0 1,1 24,14 Z" fill="url(#blueGrad)" />
      <!-- Inner 'S' shape -->
      <path d="M 24,16 C 18,16 14,19 14,23 C 14,29 28,27 28,34 C 28,39 22,41 17,41 C 12,41 9,39 7,37 L 9,30 C 12,33 15,35 18,35 C 22,35 24,33 24,30 C 24,24 10,26 10,19 C 10,14 16,11 22,11 C 26,11 29,13 31,15 L 28,21 C 26,18 24,16 24,16 Z" fill="url(#redGrad)" />
    </g>

    <!-- Bottom SMART CLASS 3D Lettering -->
    <g transform="translate(300, 620)" text-anchor="middle">
      <text x="0" y="0" 
            font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" 
            font-size="46" 
            font-weight="900" 
            letter-spacing="5"
            fill="#5A0805" 
            transform="translate(1, 3)">SMART CLASS</text>
      <text x="0" y="0" 
            font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" 
            font-size="46" 
            font-weight="900" 
            letter-spacing="5"
            fill="url(#textRedGrad)">SMART CLASS</text>
    </g>
  </g>
</svg>
